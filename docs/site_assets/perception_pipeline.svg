<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="980" height="300" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <text x="490" y="32" text-anchor="middle" font-size="24" font-family="Montserrat, Helvetica, Arial, sans-serif" font-weight="200" fill="#000000">TWO PERCEPTION PIPELINES FROM THE DEMOS</text>

  <text x="20" y="80" font-size="14" font-weight="500" fill="#000000">DEMO 3 · LIDAR</text>
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="92" width="150" height="56" rx="8" fill="#EC008C" stroke="#000000"/><text x="95" y="116">15-beam scan</text><text x="95" y="134" fill="#000000">10 Hz</text>
    <rect x="210" y="92" width="150" height="56" rx="8" fill="#EC008C" stroke="#000000"/><text x="285" y="116">occupancy grid</text><text x="285" y="134" fill="#000000">5 cm cells</text>
    <rect x="400" y="92" width="150" height="56" rx="8" fill="#EC008C" stroke="#000000"/><text x="475" y="116">inflate obstacles</text><text x="475" y="134" fill="#000000">by robot radius</text>
    <rect x="590" y="92" width="150" height="56" rx="8" fill="#EC008C" stroke="#000000"/><text x="665" y="116">A* path</text><text x="665" y="134" fill="#000000">re-plan 4×/s</text>
    <rect x="780" y="92" width="180" height="56" rx="8" fill="#EC008C" stroke="#000000"/><text x="870" y="116" fill="#000000" font-weight="500">pure pursuit</text><text x="870" y="134" fill="#000000">→ wheel speeds</text>
  </g>
  <g stroke="#000000" stroke-width="2" marker-end="url(#b)">
    <line x1="170" y1="120" x2="208" y2="120"/><line x1="360" y1="120" x2="398" y2="120"/>
    <line x1="550" y1="120" x2="588" y2="120"/><line x1="740" y1="120" x2="778" y2="120"/>
  </g>

  <text x="20" y="200" font-size="14" font-weight="500" fill="#000000">DEMO 4 · CAMERA</text>
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="212" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#000000"/><text x="95" y="236">RGB image</text><text x="95" y="254" fill="#000000">640 × 360, 30 Hz</text>
    <rect x="210" y="212" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#000000"/><text x="285" y="236">HSV colour space</text><text x="285" y="254" fill="#000000">separate hue</text>
    <rect x="400" y="212" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#000000"/><text x="475" y="236">threshold orange</text><text x="475" y="254" fill="#000000">+ clean-up</text>
    <rect x="590" y="212" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#000000"/><text x="665" y="236">largest blob</text><text x="665" y="254" fill="#000000">centre, size</text>
    <rect x="780" y="212" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#000000"/><text x="870" y="236" fill="#000000" font-weight="500">bearing → steer</text><text x="870" y="254" fill="#000000">search · track · arrive</text>
  </g>
  <g stroke="#000000" stroke-width="2" marker-end="url(#b)">
    <line x1="170" y1="240" x2="208" y2="240"/><line x1="360" y1="240" x2="398" y2="240"/>
    <line x1="550" y1="240" x2="588" y2="240"/><line x1="740" y1="240" x2="778" y2="240"/>
  </g>
</svg>
