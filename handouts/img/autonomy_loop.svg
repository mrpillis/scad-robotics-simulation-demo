<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">The autonomy loop, inside a simulator</text>
  <text x="440" y="58" text-anchor="middle" font-size="14" fill="#555">The controller code is the same in simulation and on hardware; only the world it talks to changes.</text>

  <!-- simulator frame -->
  <rect x="20" y="80" width="840" height="300" rx="14" fill="#f6f4ef" stroke="#c9c3b5" stroke-dasharray="6 5"/>
  <text x="36" y="104" font-size="13" fill="#7a7466" font-weight="700">SIMULATOR (MuJoCo · Isaac Sim · Unity · Gazebo)</text>

  <!-- world+physics -->
  <rect x="50" y="160" width="190" height="140" rx="10" fill="#e9eef8" stroke="#3f63b5" stroke-width="2"/>
  <text x="145" y="195" text-anchor="middle" font-size="17" font-weight="700" fill="#1d3570">World + Physics</text>
  <text x="145" y="222" text-anchor="middle" font-size="13" fill="#333">gravity · contact</text>
  <text x="145" y="242" text-anchor="middle" font-size="13" fill="#333">friction · motors</text>
  <text x="145" y="262" text-anchor="middle" font-size="13" fill="#333">step every 2 ms</text>

  <!-- controller -->
  <rect x="290" y="112" width="460" height="258" rx="12" fill="none" stroke="#d99a12" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="740" y="362" text-anchor="end" font-size="12.5" fill="#7a5200" font-weight="700">YOUR CODE (controller)</text>

  <!-- sense -->
  <rect x="310" y="135" width="200" height="80" rx="10" fill="#fff3d6" stroke="#d99a12" stroke-width="2"/>
  <text x="410" y="167" text-anchor="middle" font-size="17" font-weight="700" fill="#7a5200">SENSE</text>
  <text x="410" y="191" text-anchor="middle" font-size="12.5" fill="#333">camera · lidar · IMU · encoders</text>

  <!-- think -->
  <rect x="580" y="135" width="150" height="80" rx="10" fill="#fff3d6" stroke="#d99a12" stroke-width="2"/>
  <text x="655" y="167" text-anchor="middle" font-size="17" font-weight="700" fill="#7a5200">THINK</text>
  <text x="655" y="191" text-anchor="middle" font-size="12.5" fill="#333">perceive · map · plan</text>

  <!-- act -->
  <rect x="420" y="265" width="170" height="80" rx="10" fill="#fff3d6" stroke="#d99a12" stroke-width="2"/>
  <text x="505" y="297" text-anchor="middle" font-size="17" font-weight="700" fill="#7a5200">ACT</text>
  <text x="505" y="321" text-anchor="middle" font-size="12.5" fill="#333">wheel speeds → motors</text>

  <path d="M240 195 L308 178" stroke="#2b2b2b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M510 175 L578 175" stroke="#2b2b2b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M655 215 Q655 300 592 305" stroke="#2b2b2b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M420 310 Q300 335 242 285" stroke="#2b2b2b" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <text x="270" y="166" text-anchor="middle" font-size="12" fill="#555">sensor data</text>
  <text x="545" y="129" text-anchor="middle" font-size="12" fill="#555">detections, map</text>
  <text x="646" y="250" text-anchor="end" font-size="12" fill="#555">command (v, ω)</text>
  <text x="335" y="350" text-anchor="middle" font-size="12" fill="#555">forces</text>

  <!-- ground truth -->
  <text x="145" y="330" text-anchor="middle" font-size="12" fill="#1d3570" font-style="italic">+ ground truth for grading</text>
</svg>
